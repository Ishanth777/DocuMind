[tool.vercel]
entrypoint = "temp:app"
name = "rag-project"
version = "0.2.0"
description = "DocuMind Production-level RAG with Qdrant, Logfire Observability, and LLM Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pypdf>=4.3.0",
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "qdrant-client>=1.11.0",
    "langchain-qdrant>=0.1.4",
    "logfire>=5.0.0",
]
